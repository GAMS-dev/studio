# =============================================================================
# 1. SINGLE JOB - stoping the environment deletes the artifacts
# =============================================================================

stop_all_platforms:
  stage: .post
  allow_failure: true
  tags: [linux]
  image: alpine:latest
  dependencies: []  # avoids downloading any artifacts into this job
  environment:
    name: mr-cleanup/$CI_COMMIT_REF_SLUG
    action: stop
  before_script:
    - apk add --no-cache curl
  script:
    - echo "MR closed or merged. Deleting all platform artifacts..."
    - |
      curl --request DELETE \
        --header "PRIVATE-TOKEN: $ARTIFACT_CLEANUP_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/artifacts"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual


# =============================================================================
# 2. Cleanup outdated artifacts for Merge Requests
#    - Ensure in https://git.gams.com/devel/studio/-/settings/ci_cd
#      to turn off Artifacts: Keep artifacts from most recent successful jobs
# =============================================================================

clean_old_artifacts_on_success:
  stage: .post
  tags: [linux]
  image: alpine:latest
  dependencies: []  # avoids downloading any artifacts into this job
  before_script:
    - apk add --no-cache curl
  script:
    - |
      echo "Pipeline succeeded. Searching for previous pipelines on branch: $CI_COMMIT_REF_NAME..."
      PIPELINES=$(curl --fail -s --header "PRIVATE-TOKEN: $ARTIFACT_CLEANUP_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?ref=$CI_COMMIT_REF_NAME" | grep -o '"id":[0-9]*' | grep -o '[0-9]*' || true)
      
      if [ -z "$PIPELINES" ]; then
        echo "No pipelines found for this branch."
      else
        for OLD_PID in $PIPELINES; do
          if [ "$OLD_PID" != "$CI_PIPELINE_ID" ]; then
            echo "Deleting outdated artifacts from previous pipeline #$OLD_PID..."
            curl -s --request DELETE --header "PRIVATE-TOKEN: $ARTIFACT_CLEANUP_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$OLD_PID/artifacts"
          else
            echo "Skipping current pipeline #$OLD_PID (new artifacts are kept safe)."
          fi
        done
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    # Runs on any branch/MR change, as long as the previous stages passed
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success


# =============================================================================
# 3. Analyze what fails in "clean_old_artifacts_on_success"
# =============================================================================

diagnose_mr_pipelines:
  stage: .pre
  tags: [linux]
  image: alpine:latest
  dependencies: []
  before_script:
    - apk add --no-cache curl python3  # We use Python for strict URL encoding and JSON parsing
  script:
    - |
      echo "=== DIAGNOSE START ==="
      echo "Project ID: $CI_PROJECT_ID"
      echo "API URL: $CI_API_V4_URL"
      
      # 1. Test token validity using a lightweight endpoint (projects)
      echo "Testing API connection and token validity..."
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $ARTIFACT_CLEANUP_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID")
      echo "API Response Status Code: $HTTP_STATUS"
      
      if [ "$HTTP_STATUS" != "200" ]; then
        echo "ERROR: Token authentication failed with status code $HTTP_STATUS."
        if [ "$HTTP_STATUS" == "401" ] || [ "$HTTP_STATUS" == "403" ]; then
          echo "  - Please verify that ARTIFACT_CLEANUP_TOKEN is valid, not expired, and has the 'api' scope enabled."
        elif [ "$HTTP_STATUS" == "404" ]; then
          echo "  - Project ID not found. Ensure the runner can reach $CI_API_V4_URL."
        fi
        exit 1
      fi
      
      # 2. Safely run the actual pipeline query
      echo "Token is valid. Querying GitLab API for branch pipelines..."
      RESPONSE=$(curl -s --header "PRIVATE-TOKEN: $ARTIFACT_CLEANUP_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?ref=$CI_COMMIT_REF_NAME")
      
      # 3. Extract and display IDs
      PIPELINES=$(echo "$RESPONSE" | python3 -c "import sys, json; print(' '.join([str(p['id']) for p in json.load(sys.stdin)]))" || true)
      echo "Found Pipeline IDs for this branch: $PIPELINES"
      
      if [ -z "$PIPELINES" ]; then
        echo "ERROR: No pipelines found or API returned malformed data."
        exit 1
      fi
      
      echo "Success! Proceeding with the build..."
      echo "=== DIAGNOSE END ==="
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*/'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
