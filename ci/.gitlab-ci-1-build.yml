.symbols-flag:
  - QMAKE_SYMBOLS=""
  - if [ -n "$CI_COMMIT_TAG" ] || [ "$WITH_SYMBOLS" = "1" ]; then QMAKE_SYMBOLS="CONFIG+=with_symbols"; fi
  - STUDIO_VERSION=$(grep ^STUDIO_MAJOR_VERSION= version | cut -f2 -d=).$(grep ^STUDIO_MINOR_VERSION= version | cut -f2 -d=).$(grep ^STUDIO_PATCH_LEVEL= version | cut -f2 -d=)

build-deg:
  stage: build
  tags: [macos]
  needs: [fetch-ci-scripts, quality-gate]
  variables:
    qtpath: /opt/Qt/${QT_VERSION}/bin
  script:
    - !reference [.get-gams]
    - !reference [.gams-folder-deg]
    - !reference [.symbols-flag]
    - printf "GAMS_DISTRIB=$HOME/cache/gams-installs/`cat gams_folder_deg.txt`\n" > gamsinclude.pri
    - printf "GAMS_DISTRIB_C_API=\$\$GAMS_DISTRIB/apifiles/C/api\n" >> gamsinclude.pri
    - printf "GAMS_DISTRIB_CPP_API=\$\$GAMS_DISTRIB/apifiles/C++/api\n" >> gamsinclude.pri
    - mkdir build && cd build
    - PATH="${qtpath}:${PATH}"
    - qmake ../gams-studio.pro CONFIG+=release $QMAKE_SYMBOLS && make -j4
    - mkdir -p ../symbols
    - find . -name "*.dSYM" -type d -prune -exec ditto -c -k --keepParent {} ../symbols/GAMS_Studio-$STUDIO_VERSION-macos-x86_64.dSYM.zip \;
  artifacts:
    name: studio-deg
    expire_in: 2 hours
    paths: [build/*, symbols/]
    exclude: ["build/**/*.pch", "build/**/*.pch/**", "build/**/*.gch/**"]  # precompiled headers

build-dac:
  stage: build
  tags: [macos-arm64]
  needs: [fetch-ci-scripts, quality-gate]
  variables:
    qtpath: /opt/Qt/${QT_VERSION}/bin
  script:
    - !reference [.get-gams]
    - !reference [.gams-folder-dac]
    - !reference [.symbols-flag]
    - printf "GAMS_DISTRIB=$HOME/cache/gams-installs/`cat gams_folder_dac.txt`\n" > gamsinclude.pri
    - printf "GAMS_DISTRIB_C_API=\$\$GAMS_DISTRIB/apifiles/C/api\n" >> gamsinclude.pri
    - printf "GAMS_DISTRIB_CPP_API=\$\$GAMS_DISTRIB/apifiles/C++/api\n" >> gamsinclude.pri
    - mkdir build && cd build
    - PATH="${qtpath}:${PATH}"
    - qmake ../gams-studio.pro CONFIG+=release $QMAKE_SYMBOLS && make -j4
    - mkdir -p ../symbols
    - find . -name "*.dSYM" -type d -prune -exec ditto -c -k --keepParent {} ../symbols/GAMS_Studio-$STUDIO_VERSION-macos-arm_64.dSYM.zip \;
  artifacts:
    name: studio-dac
    expire_in: 2 hours
    paths: [build/*, symbols/]
    exclude: ["build/**/*.pch", "build/**/*.pch/**", "build/**/*.gch/**"]  # precompiled headers

build-leg:
  stage: build
  tags: [linux]
  needs: [fetch-ci-scripts, quality-gate]
  image:
    name: $GAMS_CONTAINER_REGISTRY/qt-machines/leg/builder-${QT_IMAGE_VERSION}:latest
    entrypoint: [""]   # prevent startup.sh
  variables:
    DOLLAR_GAMS: $$$$GAMS_DISTRIB
  script:
    - !reference [.get-gams]
    - !reference [.gams-folder-leg]
    - !reference [.symbols-flag]
    - echo "GAMS_DISTRIB=/cache/gams-installs/`cat gams_folder_leg.txt`" > gamsinclude.pri
    - echo "GAMS_DISTRIB_C_API=$DOLLAR_GAMS/apifiles/C/api" >> gamsinclude.pri
    - echo "GAMS_DISTRIB_CPP_API=$DOLLAR_GAMS/apifiles/C++/api" >> gamsinclude.pri
    - mkdir build && cd build
    - qmake ../gams-studio.pro CONFIG+=release $QMAKE_SYMBOLS && make -j4
    - mkdir -p ../symbols
    - find . -name "*.debug" -type f -exec mv {} ../symbols/GAMS_Studio-$STUDIO_VERSION-linux-x86_64.debug \;
  artifacts:
    name: studio-leg
    expire_in: 2 hours
    paths: [build/*, symbols/]
    exclude: ["build/**/*.pch", "build/**/*.pch/**", "build/**/*.gch/**"]  # precompiled headers

build-wei:
  stage: build
  tags: [windows]
  needs: [fetch-ci-scripts, quality-gate]
  variables:
     cmd_vcvars: C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat
  image:
    name: $GAMS_CONTAINER_REGISTRY/qt-machines/wei/builder-${QT_IMAGE_VERSION}:latest
    entrypoint: [""]
  script:
    - $env:Path = "C:\Miniconda\Library\bin;C:\Miniconda\DLLs;" + $env:Path
    - $env:Path = "C:\Qt\Tools\icu\bin64;" + $env:PATH
    - !reference [.get-gams-wei]
    - !reference [.gams-folder-wei]
    - '& $cmd_vcvars'
    - $gpath = "C:/Cache/gams-installs/$((Get-Content mygmsdir.tmp -Raw).Trim())"
    - $data = @(
         "GAMS_DISTRIB=$gpath",
         "GAMS_DISTRIB_C_API=$gpath/apifiles/C/api",
         "GAMS_DISTRIB_CPP_API=$gpath/apifiles/C++/api"
      )
    - $data | out-file -encoding ascii gamsinclude.pri
    - New-Item -ItemType Directory -Path build -Force | Out-Null
    - Set-Location build
    - $qmakeArgs = @("..\gams-studio.pro", "CONFIG+=release", "QMAKE_CFLAGS+=-MP", "QMAKE_CXXFLAGS+=-MP")
    - if ($env:CI_COMMIT_TAG -or $env:WITH_SYMBOLS -eq '1') { $qmakeArgs += "CONFIG+=with_symbols" }
    - $env:PATH="C:\Qt\Tools\icu\bin64;$env:PATH"; & qmake.exe @qmakeArgs
    - Copy-Item "$gpath\libssl-3-x64.dll" .
    - Copy-Item "$gpath\libcrypto-3-x64.dll" .
    - nmake.exe
    - New-Item -ItemType Directory -Path ..\symbols -Force | Out-Null
    - $studioVersion = (Select-String -Path ..\version -Pattern '^STUDIO_(MAJOR_VERSION|MINOR_VERSION|PATCH_LEVEL)=' | ForEach-Object { $_.Line.Split('=')[1] }) -join '.'
    - Get-ChildItem -Recurse -Filter studio.pdb | Where-Object { Test-Path ($_.FullName -replace '\.pdb$','.exe') } | Move-Item -Destination "..\symbols\GAMS_Studio-$studioVersion-windows-x86_64.pdb"
  artifacts:
    name: studio-wei
    expire_in: 2 hours
    paths: [build/*, symbols/]
    exclude: ["build/**/*.pch", "build/**/*.pch/**", "build/**/*.gch/**"]  # precompiled headers

.symbols:
  stage: symbols
  tags: [linux]
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG || $WITH_SYMBOLS == "1"
  variables:
    GIT_STRATEGY: none
  script:
    - ls -R symbols
  artifacts:
    expire_in: 6 months
    paths: [symbols/]

symbols-deg:
  extends: .symbols
  needs: [build-deg]
  artifacts:
    name: studio-deg-symbols-$CI_COMMIT_REF_SLUG

symbols-dac:
  extends: .symbols
  needs: [build-dac]
  artifacts:
    name: studio-dac-symbols-$CI_COMMIT_REF_SLUG

symbols-leg:
  extends: .symbols
  needs: [build-leg]
  artifacts:
    name: studio-leg-symbols-$CI_COMMIT_REF_SLUG

symbols-wei:
  extends: .symbols
  needs: [build-wei]
  artifacts:
    name: studio-wei-symbols-$CI_COMMIT_REF_SLUG
