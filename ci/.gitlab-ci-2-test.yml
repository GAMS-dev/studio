test-deg:
  stage: test
  tags: [macos]
  needs: 
    - job: fetch-ci-scripts
    - job: build-deg
      optional: true
    - job: build-deg-tags
      optional: true
    - job: build-deg-gold
      optional: true
  variables:
    qtpath: /opt/Qt/${QT_VERSION}/bin
  script:
    - !reference [.get-gams]
    - !reference [.gams-folder-deg]
    - GAMS_PATH=$HOME/cache/gams-installs/`cat gams_folder_deg.txt`
    - PATH="${qtpath}:${GAMS_PATH}:${PATH}"
    - cd build && mkdir reports
    - REPORTS_DIR=$(pwd)/reports
    - |+
      set +e
      cd tests/bin
      for f in *
      do
        ./$f -junitxml -o $REPORTS_DIR/$f.xml
      done
  artifacts:
    name: unittest-results-deg
    paths:
      - build/src/bin/*
      - build/reports/*
    reports:
      junit: build/reports/*

